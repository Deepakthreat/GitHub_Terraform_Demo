name: 'IAC Assist Terraform Action'
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Do you want to process all files?'
        required: false
        default: 'No - Only Last Commit Files'
        type: choice
        options:
          - Yes - All Files
          - No - Only Last Commit Files
  push:
    branches: [master, main]

jobs:
  analysis:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: checkout version
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node
        uses: actions/setup-node@v5
        with:
          node-version: 18

      - name: Clone parser repo
        uses: actions/checkout@v5
        with:
          repository: threatModeler/GitLabCLI
          token: ${{ secrets.PAT_TOKEN }}
          path: parser
          ref: bitbucket_clone_before_Cfn_support

      - name: Update env
        env:
          FULL_SCAN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.reason == 'Yes - All Files' }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$FULL_SCAN" = "true" ]; then
            FILES=$(git ls-files)                                                   # all tracked files
          elif [ -n "$BEFORE_SHA" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            FILES=$(git diff --name-only --diff-filter=ACMRD "$BEFORE_SHA" HEAD)    # push: same range tj-actions used
          else
            FILES=$(git diff --name-only --diff-filter=ACMRD HEAD~1 HEAD 2>/dev/null || git ls-files)  # dispatch "last commit", force-push, first push
          fi
          echo "CHANGED_FILES=$(printf '%s\n' "$FILES" | sed '/^$/d' | jq -R . | jq -cs .)" >> "$GITHUB_ENV"
          echo "FULL_SCAN=$FULL_SCAN" >> "$GITHUB_ENV"
          echo "API_KEY=${{ secrets.TMIAC_API_KEY }}" >> "$GITHUB_ENV"
          echo "BASE_URL=${{ secrets.BASE_URL }}" >> "$GITHUB_ENV"

      - name: Run parser
        run: |
          node ./parser/main.js

      - name: Store logs results as Build Artifact
        uses: actions/upload-artifact@v6
        with:
          name: assets-for-download
          path: ./logs/
