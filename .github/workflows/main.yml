name: 'IAC Assist Terraform Action'
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Do you want to process all files?'
        required: false
        default: 'No - Only Last Commit Files'
        type: choice
        options:
          - Yes - All Files
          - No - Only Last Commit Files
  push:
    branches: [master, main]

jobs:
  analysis:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: checkout version
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node
        uses: actions/setup-node@v5
        with:
          node-version: 18

      - name: Clone parser repo
        uses: actions/checkout@v5
        with:
          repository: threatModeler/GitLabCLI
          token: ${{ secrets.PAT_TOKEN }}
          path: parser
          ref: github

      - name: Get all changed files
        id: changed-files
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.reason == 'Yes - All Files') }}
        uses: tj-actions/changed-files@v46
        with:
          separator: ','
          json: true
          write_output_files: true

      - name: Update env
        env:
          ALL_MODIFIED: ${{ steps.changed-files.outputs.all_modified_files }}
        run: |
          {
            echo "CHANGED_FILES<<EOF"
            echo "$ALL_MODIFIED"
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "FULL_SCAN=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.reason == 'Yes - All Files' }}" >> "$GITHUB_ENV"
          echo "API_KEY=${{ secrets.TMIAC_API_KEY }}" >> "$GITHUB_ENV"
          echo "BASE_URL=${{ secrets.BASE_URL }}" >> "$GITHUB_ENV"

      - name: Log scan selection
        env:
          REASON: ${{ github.event.inputs.reason }}
          CF_OUTCOME: ${{ steps.changed-files.outcome }}
          CF_RAW_OUTPUT: ${{ steps.changed-files.outputs.all_modified_files }}
        run: |
          echo "Event name              : ${{ github.event_name }}"
          echo "Selected option (reason): ${REASON:-<empty - push event>}"
          echo "changed-files step      : $CF_OUTCOME"
          echo "changed-files raw output: $CF_RAW_OUTPUT"
          echo "FULL_SCAN (env)         : $FULL_SCAN"
          echo "CHANGED_FILES (env)     : $CHANGED_FILES"

      - name: Run parser
        run: |
          node ./parser/main.js

      - name: Store logs results as Build Artifact
        uses: actions/upload-artifact@v6
        with:
          name: assets-for-download
          path: ./logs/
